name: build-stirling-pdf

on:
  push:
    branches:
      - main
    tags:
      - "stirling-pdf-*"
    paths:
      - "stirling-pdf/**"
      - ".github/workflows/build-stirling-pdf.yaml"
  pull_request:
    paths:
      - "stirling-pdf/**"
      - ".github/workflows/build-stirling-pdf.yaml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/crystalmethod/stirling-pdf

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=match,pattern=stirling-pdf-(\d+\.\d+\.\d+(?:-fat)?),group=1,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: stirling-pdf
          file: stirling-pdf/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify Brotli decoder is absent
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm --entrypoint sh "${IMAGE}:sha-${GITHUB_SHA::7}" -c \
            'test ! -e /app/lib/dec-0.1.2.jar && ! ls /app/lib | grep -qE "^dec-"'
