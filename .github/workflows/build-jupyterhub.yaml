name: build-jupyterhub

on:
  push:
    branches:
      - main
    tags:
      - "jupyterhub-*"
    paths:
      - "jupyterhub/**"
      - ".github/workflows/build-jupyterhub.yaml"
  pull_request:
    paths:
      - "jupyterhub/**"
      - ".github/workflows/build-jupyterhub.yaml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/crystalmethod/jupyterhub

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=match,pattern=jupyterhub-(\d+\.\d+\.\d+),group=1,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: jupyterhub
          file: jupyterhub/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
