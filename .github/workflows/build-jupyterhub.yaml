name: build-jupyterhub

on:
  push:
    branches:
      - main
    tags:
      - "jupyterhub-*"
    paths:
      - "jupyterhub/**"
      - ".github/workflows/build-jupyterhub.yaml"
  pull_request:
    paths:
      - "jupyterhub/**"
      - ".github/workflows/build-jupyterhub.yaml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/crystalmethod/jupyterhub

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=match,pattern=jupyterhub-(\d+\.\d+\.\d+),group=1,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: jupyterhub
          file: jupyterhub/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Security gates run against the published image. They are skipped on
      # pull requests because there is no pushed image to scan there.

      - name: Trivy — SBOM (CycloneDX) + Dependency Graph upload
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom.cdx.json
          github-pat: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Trivy — SARIF report (non-blocking, Security tab)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          limit-severities-for-sarif: true
        continue-on-error: true

      - name: Trivy — Build gate (fails on CRITICAL/HIGH, unfixed ignored)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          skip-setup-trivy: true

      # Reporting runs after the gate: it must never mask or skip the gate.
      # The SARIF file can be absent when no findings match the severity, so
      # the upload is best-effort and never blocks the workflow.

      - name: Upload Trivy SARIF (Security tab)
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: container-scanning
        continue-on-error: true
